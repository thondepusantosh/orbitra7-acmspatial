<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ee"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
  </defs>

  <!-- phone screen -->
  <rect width="360" height="740" rx="30" fill="#f7f9fc"/>
  <rect width="360" height="330" rx="30" fill="url(#top)"/>
  <text x="26" y="34" font-size="13" font-weight="600" fill="#1f2937">7:42</text>
  <rect x="300" y="24" width="34" height="13" rx="4" fill="none" stroke="#1f2937" stroke-width="1.4"/>
  <rect x="303" y="27" width="24" height="7" rx="2" fill="#1f2937"/>

  <!-- EXAMPLE tag -->
  <rect x="124" y="52" width="112" height="24" rx="12" fill="#111827"/>
  <text x="180" y="68.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2.4" fill="#ffffff">EXAMPLE</text>

  <!-- 2: success status -->
  <circle cx="180" cy="134" r="36" fill="#16a34a"/>
  <path d="M163 135l11 11 23-25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Payment Successful</text>
  <rect x="84" y="176" width="192" height="30" rx="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="284" cy="178" r="11" fill="#2563eb"/><text x="284" y="182.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>

  <!-- 1: amount -->
  <text x="180" y="256" text-anchor="middle" font-size="44" font-weight="800" fill="#111827" letter-spacing="-1">₹750</text>
  <rect x="104" y="216" width="152" height="54" rx="12" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="264" cy="218" r="11" fill="#2563eb"/><text x="264" y="222.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>

  <!-- 3: date & time -->
  <text x="180" y="302" text-anchor="middle" font-size="14" fill="#4b5563">09 Oct 2026, 7:42 PM</text>
  <rect x="100" y="284" width="160" height="27" rx="9" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="268" cy="286" r="11" fill="#2563eb"/><text x="268" y="290.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>

  <!-- details card -->
  <rect x="20" y="342" width="320" height="262" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="40" y="376" font-size="12" fill="#6b7280">To</text>
  <text x="40" y="396" font-size="15" font-weight="600" fill="#111827">ORBITRA7 organiser</text>
  <text x="40" y="414" font-size="12" fill="#6b7280">organiser UPI ID</text>
  <line x1="40" y1="432" x2="320" y2="432" stroke="#eef0f3"/>
  <text x="40" y="458" font-size="12" fill="#6b7280">From</text>
  <text x="40" y="478" font-size="15" font-weight="600" fill="#111827">Your bank account</text>
  <line x1="40" y1="496" x2="320" y2="496" stroke="#eef0f3"/>

  <!-- 4: transaction id -->
  <text x="40" y="522" font-size="12" fill="#6b7280">UPI transaction ID</text>
  <text x="40" y="546" font-size="19" font-weight="700" fill="#111827" letter-spacing="1">412345678901</text>
  <rect x="30" y="506" width="232" height="52" rx="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="270" cy="508" r="11" fill="#2563eb"/><text x="270" y="512.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="40" y="584" font-size="12" fill="#6b7280">Status: <tspan fill="#15803d" font-weight="700">Completed</tspan></text>

  <!-- legend -->
  <rect x="20" y="622" width="320" height="96" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <g font-size="12.5" fill="#1e3a8a" font-weight="600">
    <circle cx="42" cy="646" r="9" fill="#2563eb"/><text x="42" y="650" text-anchor="middle" font-size="10.5" fill="#fff">1</text>
    <text x="58" y="650">Amount paid</text>
    <circle cx="192" cy="646" r="9" fill="#2563eb"/><text x="192" y="650" text-anchor="middle" font-size="10.5" fill="#fff">2</text>
    <text x="208" y="650">Success status</text>
    <circle cx="42" cy="676" r="9" fill="#2563eb"/><text x="42" y="680" text-anchor="middle" font-size="10.5" fill="#fff">3</text>
    <text x="58" y="680">Date &amp; time</text>
    <circle cx="192" cy="676" r="9" fill="#2563eb"/><text x="192" y="680" text-anchor="middle" font-size="10.5" fill="#fff">4</text>
    <text x="208" y="680">Transaction ID</text>
  </g>
  <text x="180" y="705" text-anchor="middle" font-size="11" fill="#475569">All four must be clearly visible in your screenshot</text>
</svg>
